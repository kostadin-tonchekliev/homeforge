---
# Docker sandbox overrides. Secrets here are throwaway dummy values in plain text.

# The sandbox image's sudo user (there is no chonk in the sandbox)
homeserver_user: ansible

# No public DNS for the sandbox: Caddy signs certificates with its own local CA
caddy_tls_mode: internal
caddy_cf_api_token: dev-not-used

pihole_password: dev-pihole

postgres_password: dev-postgres
postgres_exporter_password: dev-exporter
postgres_app_passwords:
  deadair: dev-deadair
  gitlab: dev-gitlab
  grafana: dev-grafana
  homarr: dev-homarr
  homeassistant: dev-homeassistant
  jellystat: dev-jellystat
  openwebui: dev-openwebui
  prowlarr: dev-prowlarr
  radarr: dev-radarr
  sonarr: dev-sonarr

grafana_db_password: dev-grafana

redis_app_passwords:
  deadair: dev-deadair-redis
  homarr: dev-homarr-redis
redis_exporter_password: dev-redis-exporter

# Homepage widgets can't authenticate in the sandbox (fresh apps have other keys); that's fine
homepage_widget_keys:
  jellyfin: dev-key
  jellystat: dev-key
  audiobookshelf: dev-key
  kavita: dev-key
  sonarr: dev-key
  radarr: dev-key
  prowlarr: dev-key
  dockhand: dev-key
  home_assistant: dev-key
  gitlab: dev-key
deluge_web_password: deluge

esphome_password: dev-esphome

home_assistant_secrets:
  some_password: dev
  todoist_token: dev
  caldav_username: dev
  caldav_password: dev

gitlab_runner_tokens:
  runner-1: dev-not-registered
  runner-2: dev-not-registered

jellystat_jwt_secret: dev-jellystat-jwt

homarr_secret_encryption_key: "de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7de7d"
# No API key: it only exists after the onboarding in the sandbox's Homarr, so the apps and
# integrations aren't registered there unless one is passed with -e homarr_api_key=...
homarr_api_key: ""

# Nested Docker refuses rslave mounts of /
node_exporter_rootfs_propagation: ""
