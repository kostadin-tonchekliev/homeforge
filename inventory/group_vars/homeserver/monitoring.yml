---
# Settings for the prometheus.prometheus collection roles (wrapped by roles/prometheus and
# roles/node_exporter). They live here because inventory vars override the collection's role defaults.

# --- Prometheus ---
prometheus_storage_retention: 15d
prometheus_config_flags_extra:
  web.enable-lifecycle:
prometheus_alert_rules: []
prometheus_external_labels: {}

prometheus_global:
  scrape_interval: 1s
  evaluation_interval: 1s

prometheus_scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["localhost:8080"]
  # Caddy's internal-only metrics listener (not published; reachable from the host via the proxy network)
  - job_name: caddy
    scrape_interval: 15s
    static_configs:
      - targets: ["{{ homeserver_caddy_ip }}:2020"]
  # postgres-exporter (/opt/postgres), published on localhost only
  - job_name: postgres
    scrape_interval: 15s
    static_configs:
      - targets: ["127.0.0.1:9187"]

# --- node_exporter (same user as the original hand install) ---
node_exporter_system_user: node_exporter
node_exporter_system_group: node_exporter
node_exporter_enabled_collectors: []
