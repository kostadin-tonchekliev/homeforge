---
# Full setup of the home server. Every role is tagged with its own name:
#   ansible-playbook playbooks/setup.yml --tags caddy
- name: Base host setup
  ansible.builtin.import_playbook: base.yml

- name: Core services
  ansible.builtin.import_playbook: core.yml

- name: Media
  ansible.builtin.import_playbook: media.yml

- name: Monitoring
  ansible.builtin.import_playbook: monitoring.yml

- name: Apps
  ansible.builtin.import_playbook: apps.yml
