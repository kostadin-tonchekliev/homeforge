---
- name: main | Deploy the Homepage stack
  ansible.builtin.include_role:
    name: compose_app
  vars:
    compose_app_name: gethomepage
    compose_app_dirs:
      - path: config
    compose_app_env:
      HOMEPAGE_VAR_PIHOLE_PASSWORD: "{{ homepage_pihole_password }}"
    compose_app_templates:
      - src: services.yaml.j2
        dest: config/services.yaml
    compose_app_files: "{{ homepage_static_files }}"
    # Homepage reloads its config files on its own
    compose_app_on_config_change: none
