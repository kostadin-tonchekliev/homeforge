---
# GitLab's own state (repos, gitlab-secrets.json, uploads) lives in config/ and data/ and
# is not managed here; only the compose stack and the runners' config.toml are.
- name: main | Deploy the GitLab stack
  ansible.builtin.include_role:
    name: compose_app
  vars:
    compose_app_name: gitlab
    compose_app_dirs:
      - path: config
      - path: logs
      - path: data
      - path: runners
    compose_app_env:
      GITLAB_DB_PASSWORD: "{{ gitlab_db_password }}"
    compose_app_on_config_change: none

- name: main | Create the runners' config directories
  ansible.builtin.file:
    path: "/opt/gitlab/runners/{{ item.name }}/config"
    state: directory
    owner: "{{ homeserver_user }}"
    group: "{{ homeserver_user }}"
    mode: "0775"
  loop: "{{ gitlab_runners }}"
  loop_control:
    label: "{{ item.name }}"

# The runners re-read config.toml on their own
- name: main | Write the runners' config
  ansible.builtin.template:
    src: runner-config.toml.j2
    dest: "/opt/gitlab/runners/{{ runner.name }}/config/config.toml"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ gitlab_runners }}"
  loop_control:
    loop_var: runner
    label: "{{ runner.name }}"
  no_log: true
