---
# Install steps copied from the official Docker docs:
# https://docs.docker.com/engine/install/ubuntu/#install-using-the-repository

- name: setup | Make sure the keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: setup | Add Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: setup | Add Docker's official APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Architectures: {{ homeserver_deb_arch }}
      Signed-By: /etc/apt/keyrings/docker.asc

# Older installs used the one-line format; keeping both makes apt warn about duplicate sources
- name: setup | Remove the legacy one-line Docker APT source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: setup | Install the Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: setup | Enable and start the Docker service
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
