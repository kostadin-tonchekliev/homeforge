---
# Install steps copied from the official Docker docs:
# https://docs.docker.com/engine/install/ubuntu/#install-using-the-repository

- name: setup | Map uname architecture to the Debian architecture used by Docker's APT repo
  ansible.builtin.set_fact:
    docker_apt_architecture: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"

- name: setup | Make sure the keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: setup | Add Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: setup | Add Docker's official APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Architectures: {{ docker_apt_architecture }}
      Signed-By: /etc/apt/keyrings/docker.asc

- name: setup | Install the Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: setup | Enable and start the Docker service
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
