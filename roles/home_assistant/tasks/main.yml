---
- name: main | Create the config directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ homeserver_user }}"
    group: "{{ homeserver_user }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: /opt/home-assistant, mode: "0755" }
    - { path: /opt/home-assistant/config, mode: "0775" }
  loop_control:
    label: "{{ item.path }}"

# configuration.yaml !includes these; HA's UI editors own them, so they're only created
# empty on a fresh install (never overwritten) — HA starts in recovery mode when they're missing
- name: main | Create the UI-managed include files if they don't exist yet
  ansible.builtin.copy:
    dest: "/opt/home-assistant/config/{{ item.name }}"
    content: "{{ item.content }}"
    force: false
    owner: root
    group: root
    mode: "0644"
  loop:
    - { name: automations.yaml, content: "[]\n" }
    - { name: scripts.yaml, content: "{}\n" }
    - { name: scenes.yaml, content: "[]\n" }
  loop_control:
    label: "{{ item.name }}"

# Only the hand-written YAML config and helper scripts are managed. Everything HA edits
# itself (.storage, automations.yaml from the UI editor, HACS, the zigbee DB) is app state.
- name: main | Deploy the Home Assistant stack
  ansible.builtin.include_role:
    name: compose_app
  vars:
    compose_app_name: home-assistant
    compose_app_dirs:
      - path: config
      - path: config/scripts
      - path: config/themes
    compose_app_templates:
      - src: secrets.yaml.j2
        dest: config/secrets.yaml
        owner: root
        group: root
    compose_app_files: "{{ home_assistant_files }}"
