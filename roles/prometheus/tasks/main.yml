---
- name: main | Deploy the Prometheus stack
  ansible.builtin.include_role:
    name: compose_app
  vars:
    compose_app_name: prometheus
    compose_app_dirs:
      - path: config
      - path: data
        owner: "{{ prometheus_container_uid }}"
        group: "{{ prometheus_container_uid }}"
        mode: "0755"
    compose_app_templates:
      - src: prometheus.yml.j2
        dest: config/prometheus.yml
    # --web.enable-lifecycle: re-read prometheus.yml without a restart
    compose_app_on_config_change: command
    compose_app_reload_command: [docker, kill, --signal, HUP, prometheus]
