---
- name: config | Set the server and database settings in grafana.ini
  community.general.ini_file:
    path: /etc/grafana/grafana.ini
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: root
    group: grafana
    mode: "0640"
  loop: "{{ grafana_ini }}"
  loop_control:
    label: "[{{ item.section }}] {{ item.option }}"
  no_log: "{{ item.option == 'password' }}"
  notify: Restart grafana

- name: config | Provision the data sources
  ansible.builtin.template:
    src: datasources.yaml.j2
    dest: /etc/grafana/provisioning/datasources/homelab.yaml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: config | Provision the dashboard folders
  ansible.builtin.copy:
    src: dashboards.yaml
    dest: /etc/grafana/provisioning/dashboards/homelab.yaml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

# Grafana re-reads these files on its own; no restart needed
- name: config | Copy the dashboards
  ansible.builtin.copy:
    src: dashboards/
    dest: /var/lib/grafana/dashboards/
    owner: grafana
    group: grafana
    mode: "0644"
    directory_mode: "0755"

- name: config | Enable and start Grafana
  ansible.builtin.systemd_service:
    name: grafana-server
    enabled: true
    state: started
    daemon_reload: true
