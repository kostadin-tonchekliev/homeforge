---
# Install steps from the official Grafana docs:
# https://grafana.com/docs/grafana/latest/setup-grafana/installation/debian/

- name: install | Install the prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - wget
      - gnupg
    state: present

- name: install | Make sure the keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: install | Add Grafana's GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg-full.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: install | Add the Grafana APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/grafana.list
    content: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main\n"
    owner: root
    group: root
    mode: "0644"

# Older installs used a dearmored key under this name; the repo now points at grafana.asc
- name: install | Remove the legacy Grafana keyring
  ansible.builtin.file:
    path: /etc/apt/keyrings/grafana.gpg
    state: absent

- name: install | Install Grafana OSS
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true
