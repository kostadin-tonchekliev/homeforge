---
- name: databases | Install the PostgreSQL client library used by community.postgresql
  ansible.builtin.apt:
    name: python3-psycopg2
    state: present

- name: databases | Create the app logins
  community.postgresql.postgresql_user:
    name: "{{ item.role }}"
    password: "{{ postgres_app_passwords[item.role] }}"
    login_host: 127.0.0.1
    login_user: postgres
    login_password: "{{ postgres_password }}"
  loop: "{{ postgres_apps }}"
  loop_control:
    label: "{{ item.role }}"
  no_log: true

- name: databases | Create the app databases
  community.postgresql.postgresql_db:
    name: "{{ item.1 }}"
    owner: "{{ item.0.role }}"
    login_host: 127.0.0.1
    login_user: postgres
    login_password: "{{ postgres_password }}"
  loop: "{{ postgres_apps | subelements('databases') }}"
  loop_control:
    label: "{{ item.1 }}"

- name: databases | Stop other logins from connecting to the app databases
  community.postgresql.postgresql_privs:
    login_db: postgres
    type: database
    objs: "{{ item.1 }}"
    privs: CONNECT
    roles: PUBLIC
    state: absent
    login_host: 127.0.0.1
    login_user: postgres
    login_password: "{{ postgres_password }}"
  loop: "{{ postgres_apps | subelements('databases') }}"
  loop_control:
    label: "{{ item.1 }}"

- name: databases | Create the extensions the apps need
  community.postgresql.postgresql_ext:
    name: "{{ item.1 }}"
    login_db: "{{ item.0.databases[0] }}"
    login_host: 127.0.0.1
    login_user: postgres
    login_password: "{{ postgres_password }}"
  loop: "{{ postgres_apps | subelements('extensions', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.databases[0] }}: {{ item.1 }}"
